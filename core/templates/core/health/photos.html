{% load i18n %}
{% if photos %}
    {% if not hide_heading %}<h2 class="h5 mt-3">{% trans "Photos" %}</h2>{% endif %}
    <div class="bb-photo-grid mb-4" data-photo-gallery>
        {% for photo in photos %}
            <a class="bb-photo-tile bb-photo-link" href="{% url 'core:health-photo' photo.pk %}" data-photo-viewer data-photo-caption="{% trans 'Saved photo' %}" aria-label="{% trans 'Enlarge photo' %} {{ forloop.counter }}">
                <img src="{% url 'core:health-photo' photo.pk %}" loading="lazy" alt="{% trans 'Saved photo' %}">
                <span class="bb-photo-caption">{% trans "Enlarge photo" %}</span>
            </a>
        {% endfor %}
    </div>
{% endif %}
