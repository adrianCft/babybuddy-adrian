{% load navigation %}
{% load i18n mobile_records %}
<nav class="bb-bottom-nav d-md-none" aria-label="{% trans 'Main navigation' %}">
    <a href="{% context_url 'dashboard:dashboard' %}"{% if request.resolver_match.app_name == 'dashboard' or request.path == '/' %} aria-current="page"{% endif %}>
        <i class="icon-dashboard" aria-hidden="true"></i><span>{% trans "Home" %}</span>
    </a>
    <a href="{% context_url 'core:timeline' %}"{% if request.path == '/timeline/' %} aria-current="page"{% endif %}>
        <i class="icon-timeline" aria-hidden="true"></i><span>{% trans "Timeline" %}</span>
    </a>
    <button type="button" class="bb-bottom-record" data-bs-toggle="offcanvas" data-bs-target="#quick-record-panel" aria-controls="quick-record-panel">
        <i class="icon-add" aria-hidden="true"></i><span>{% trans "Record" %}</span>
    </button>
    {% if perms.core.view_child %}
        <a href="{% context_url 'core:daily-summary' %}"{% if request.path == '/daily/' or request.path == '/summary/' %} aria-current="page"{% endif %}>
            <i class="icon-timeline" aria-hidden="true"></i><span>{% trans "Summaries" %}</span>
        </a>
    {% endif %}
    <button type="button" data-bs-toggle="collapse" data-bs-target="#navbar-app" aria-controls="navbar-app" aria-expanded="false">
        <span class="bb-nav-more-icon" aria-hidden="true">☰</span><span>{% trans "More" %}</span>
    </button>
</nav>
<div class="offcanvas offcanvas-bottom bb-quick-record-panel" tabindex="-1" id="quick-record-panel" aria-labelledby="quick-record-title">
    <div class="offcanvas-header">
        <h2 class="offcanvas-title h5" id="quick-record-title">{% trans "Quick record" %}</h2>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="{% trans 'Close' %}"></button>
    </div>
    <div class="offcanvas-body">
        {% quick_record_links %}
    </div>
</div>
